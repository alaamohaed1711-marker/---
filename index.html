<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0c29">

    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="آلة حاسبة">

    <!-- Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">

    <title>آلة حاسبة</title>
    <style>
        * {
            font-family: Arial, sans-serif;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            user-select: none;
        }
        .container {
            background: #1e1e2e;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid #2d2d44;
        }
        h2 {
            color: #a5b4fc;
            margin-bottom: 20px;
        }
        input[type="number"] {
            padding: 12px;
            font-size: 18px;
            width: 150px;
            margin: 5px;
            border: 2px solid #2d2d44;
            border-radius: 8px;
            text-align: center;
            background: #2d2d44;
            color: #ffffff;
        }
        input[type="number"]::placeholder {
            color: #888;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin: 15px 0;
        }
        button {
            padding: 12px 20px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            color: white;
            background: #667eea;
            transition: 0.2s;
            min-width: 60px;
        }
        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        button.clear { background: #e17055; }
        button.clear:hover { background: #d63031; }
        button.install { background: #00b894; display: none; }
        button.install:hover { background: #00a381; }
        #result {
            margin: 15px 0;
            font-size: 24px;
            color: #00b894;
            font-weight: bold;
            padding: 15px;
            background: #2d2d44;
            border-radius: 8px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .actions {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔢 آلة حاسبة</h2>
        <input type="number" id="numper1" placeholder="الرقم الأول">
        <input type="number" id="numper2" placeholder="الرقم الثاني">

        <div class="buttons">
            <button onclick="calculate('+')">➕</button>
            <button onclick="calculate('-')">➖</button>
            <button onclick="calculate('*')">✖️</button>
            <button onclick="calculate('/')">➗</button>
        </div>

        <div id="result">النتيجة: ...</div>

        <div class="actions">
            <button class="clear" onclick="clearAll()">🗑️ مسح</button>
            <button class="install" id="installBtn" onclick="installApp()">📲 تثبيت التطبيق</button>
        </div>
    </div>

    <script>
        let deferredPrompt;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBtn').style.display = 'inline-block';
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        alert('✅ تم تثبيت التطبيق! هتلاقيه في الشاشة الرئيسية');
                    }
                    deferredPrompt = null;
                });
            }
        }

        // تسجيل Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(() => console.log('✅ Service Worker مسجل'))
                    .catch((err) => console.log('❌ خطأ:', err));
            });
        }

        function calculate(operation) {
            let num1 = document.getElementById("numper1");
            let num2 = document.getElementById("numper2");

            let n1 = Number(num1.value);
            let n2 = Number(num2.value);

            if (num1.value === "" || num2.value === "") {
                document.getElementById("result").innerText = "اكتب رقمين الأول";
                return;
            }

            let result;
            let symbol;

            if (operation === "+") {
                result = n1 + n2;
                symbol = "+";
            } else if (operation === "-") {
                result = n1 - n2;
                symbol = "-";
            } else if (operation === "*") {
                result = n1 * n2;
                symbol = "×";
            } else if (operation === "/") {
                if (n2 === 0) {
                    document.getElementById("result").innerText = "مفيش قسمة على الصفر";
                    return;
                }
                result = n1 / n2;
                symbol = "÷";
            }

            document.getElementById("result").innerText = "النتيجة: " + result;
        }

        function clearAll() {
            document.getElementById("numper1").value = "";
            document.getElementById("numper2").value = "";
            document.getElementById("result").innerText = "النتيجة: ...";
        }
    </script>
</body>
</html>
